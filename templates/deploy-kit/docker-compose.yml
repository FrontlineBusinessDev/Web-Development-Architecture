# Production stack for ONE Coolify VPS (Web-Development-Architecture: deployment/architecture.md).
#
#   Coolify's Traefik (80/443, TLS) -> web-1, web-2 (Octane :8000, health check /up)
#                                   -> maintenance (:8080, only while no web container passes /up)
#   migrate (one-off per deploy) · queue · scheduler · redis
#   PostgreSQL is a separate Coolify database resource (DB_HOST), so Coolify backs it up.
#
# Leave every Domains field empty in Coolify: `migrate` writes this app's Traefik route from
# APP_URL into Traefik's dynamic folder (scripts/migrate.sh). deploy/rolling-deploy.sh replaces
# web-1 and web-2 one at a time. Never press Redeploy on the app resource: it restarts everything at once.
#
# Every name on Coolify's shared network is prefixed with __APP_SLUG__: other apps there have a
# web-1 too, and Coolify's own Redis answers to "redis" (WRONGPASS).

x-app: &app
    build:
        context: .
        dockerfile: Dockerfile
    image: __APP_SLUG__-app:latest
    env_file:
        - .env
    environment: &app-env
        APP_ENV: ${APP_ENV:-production}
        DB_CONNECTION: pgsql
        DB_HOST: '${DB_HOST:?DB_HOST is empty: set it to the Coolify PostgreSQL resource internal host}'
        DB_PORT: '${DB_PORT:-5432}'
        REDIS_HOST: __APP_SLUG__-redis
        REDIS_CLIENT: phpredis
        CACHE_STORE: redis
        SESSION_DRIVER: redis
        QUEUE_CONNECTION: redis
        LOG_STACK: single,stderr
        # Only Traefik reaches the app (no published ports), so its X-Forwarded-For is trusted.
        TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
    networks: [default, coolify]
    restart: unless-stopped
    healthcheck:
        disable: true
    depends_on: &app-deps
        redis:
            condition: service_healthy

services:
    migrate:
        <<: *app
        command: ['bash', 'scripts/migrate.sh']
        environment:
            <<: *app-env
            PROXY_ROUTES_FILE: /proxy-dynamic/__APP_SLUG__.yml
        # Root only here, to write into Traefik's root-owned dynamic folder. Every long-running service is non-root.
        user: '0:0'
        volumes:
            - ${PROXY_DYNAMIC_DIR:-/data/coolify/proxy/dynamic}:/proxy-dynamic
        restart: 'no'
        deploy:
            resources:
                limits: { cpus: '${MIGRATE_CPUS:-0.5}', memory: '${MIGRATE_MEMORY:-512M}' }

    web-1: &web
        <<: *app
        environment:
            <<: *app-env
            OCTANE_WORKERS: ${OCTANE_WORKERS:-1}
            OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-500}
        networks:
            default: {}
            coolify:
                aliases: [__APP_SLUG__-web-1]
        expose: ['8000']
        # Ready = /up answers 200: database + Redis, and no drain flag.
        healthcheck:
            test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:8000/up']
            interval: 5s
            timeout: 3s
            start_period: 60s
            retries: 3
        # SIGTERM lets Octane finish in-flight requests before the container stops.
        stop_grace_period: 30s
        deploy:
            resources:
                limits: { cpus: '${WEB_CPUS:-0.5}', memory: '${WEB_MEMORY:-576M}' }
        depends_on:
            <<: *app-deps
            migrate:
                condition: service_completed_successfully

    web-2:
        <<: *web
        networks:
            default: {}
            coolify:
                aliases: [__APP_SLUG__-web-2]

    queue:
        <<: *app
        command: ['bash', 'scripts/worker.sh']
        stop_grace_period: 60s # the current job (at most QUEUE_TIMEOUT) finishes first
        deploy:
            resources:
                limits: { cpus: '${QUEUE_CPUS:-0.1}', memory: '${QUEUE_MEMORY:-384M}' }
        depends_on:
            <<: *app-deps
            migrate:
                condition: service_completed_successfully

    # A queue with long jobs (backups, AI, exports) gets its own service named <name>-queue, with
    # QUEUE_NAMES, QUEUE_TIMEOUT and a queue connection whose retry_after is longer (deployment/architecture.md).

    scheduler:
        <<: *app
        # Every schedule in routes/console.php uses onOneServer() and withoutOverlapping().
        command: ['php', 'artisan', 'schedule:work']
        deploy:
            resources:
                limits: { cpus: '${SCHEDULER_CPUS:-0.05}', memory: '${SCHEDULER_MEMORY:-192M}' }
        depends_on:
            <<: *app-deps
            migrate:
                condition: service_completed_successfully

    # Traefik's failover while no web container passes /up: one static 503 page, no database.
    maintenance:
        <<: *app
        command: ['php', '-S', '0.0.0.0:8080', 'scripts/maintenance.php']
        networks:
            default: {}
            coolify:
                aliases: [__APP_SLUG__-maintenance]
        depends_on: {}
        deploy:
            resources:
                limits: { cpus: '${MAINTENANCE_CPUS:-0.02}', memory: '${MAINTENANCE_MEMORY:-32M}' }

    redis:
        image: redis:7.4-alpine
        # appendonly: queued retries wait up to 12 h in Redis and must survive a restart.
        # volatile-lru: only keys with a TTL (cache, sessions) are evicted; queued jobs never are.
        command:
            - sh
            - -c
            - |
                if [ -z "$$REDIS_PASSWORD" ]; then echo "REDIS_PASSWORD is empty: set it in Coolify (openssl rand -hex 32)." >&2; exit 1; fi
                exec redis-server --appendonly yes --appendfsync everysec --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy volatile-lru --requirepass "$$REDIS_PASSWORD"
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
            REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-96mb}
        networks:
            default:
                aliases: [__APP_SLUG__-redis]
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG']
            interval: 5s
            timeout: 3s
            retries: 10
        deploy:
            resources:
                limits: { cpus: '${REDIS_CPUS:-0.05}', memory: '${REDIS_MEMORY:-160M}' }
        restart: unless-stopped

networks:
    default:
    # Coolify's network: its Traefik and the managed PostgreSQL live here.
    coolify:
        name: ${COOLIFY_NETWORK:-coolify}
        external: true

volumes:
    redis-data:
